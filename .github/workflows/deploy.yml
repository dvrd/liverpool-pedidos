name: Deploy

on:
  push:
    branches:
      - main

concurrency:
  group: deploy-main
  cancel-in-progress: false

permissions:
  id-token: write
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: maven
      - name: Backend tests
        working-directory: backend
        run: mvn -B test
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Frontend tests
        working-directory: frontend
        run: npm ci && npm test && npx tsc --noEmit

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::458577091115:role/liverpool-pedidos-github-deploy
          aws-region: us-east-2
      - name: Update the host
        run: |
          set -euo pipefail
          instance=i-0687d6f26b27ff733
          cat > /tmp/ssm-deploy.json <<'EOF'
          {
            "commands": [
              "set -euo pipefail",
              "cd /opt/liverpool",
              "git -c safe.directory=/opt/liverpool fetch origin main",
              "git -c safe.directory=/opt/liverpool checkout -B main origin/main",
              "set +e",
              "bash deploy/aws/deploy.sh",
              "code=$?",
              "set -e",
              "tail -n 80 /var/log/liverpool-deploy.log",
              "exit $code"
            ]
          }
          EOF
          command_id="$(aws ssm send-command \
            --instance-ids "$instance" \
            --document-name AWS-RunShellScript \
            --timeout-seconds 1800 \
            --comment "deploy ${GITHUB_SHA}" \
            --parameters file:///tmp/ssm-deploy.json \
            --query Command.CommandId \
            --output text)"
          echo "command $command_id"
          for _ in $(seq 1 120); do
            status="$(aws ssm get-command-invocation \
              --command-id "$command_id" \
              --instance-id "$instance" \
              --query Status \
              --output text 2>/dev/null || echo Pending)"
            echo "status $status"
            case "$status" in
              Success)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$instance" \
                  --query StandardOutputContent \
                  --output text | tail -n 80
                exit 0
                ;;
              Failed|Cancelled|TimedOut|Cancelling)
                aws ssm get-command-invocation \
                  --command-id "$command_id" \
                  --instance-id "$instance" \
                  --query '[StandardOutputContent, StandardErrorContent]' \
                  --output text | tail -n 120
                exit 1
                ;;
            esac
            sleep 15
          done
          echo "the host did not finish in time" >&2
          exit 1
